# GitHub Actions：打包前端 hbbxl-web（linux/arm64）推到 GHCR
# 前置：把 zytb-vue 推到 GitHub；Actions 权限允许写 Packages
name: Build web image (arm64)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  PLATFORM: linux/arm64

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hbbxl/web:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/hbbxl/web:${{ github.sha }}
